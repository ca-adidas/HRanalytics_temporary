  <h1>Firestore 질문 초기 등록</h1>
  <p>현재 Firestore 규칙은 브라우저 쓰기를 막습니다. 로컬의 관리자 인증을 사용해 아래 명령으로 예시 질문 5개를 한 번 등록하세요. 이미 있는 문서는 덮어쓰지 않습니다.</p>
  <pre>npm install
npm run seed:questions</pre>
  <p>서비스 계정 JSON 키를 레포에 저장하지 마세요. Google Cloud CLI로 Firebase 프로젝트에 로그인하고 프로젝트를 선택한 뒤, Firestore에 쓰기 권한이 있는 계정으로 실행합니다.</p>
