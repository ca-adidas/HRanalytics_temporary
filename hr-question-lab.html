<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeopleLens — HR Analytics Question Lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{--ink:#182b27;--muted:#6b7a72;--green:#0d5b45;--lime:#d9edaa;--line:#e3e9df;--paper:#f7f8f2;--white:#fff;--orange:#e6a36d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 'DM Sans','Noto Sans KR',sans-serif}button,input{font:inherit}button{cursor:pointer}header{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(30px,calc((100vw - 1320px)/2));gap:20px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.6px;font-size:21px}.mark{width:34px;height:34px;background:var(--green);color:#fff;border-radius:10px;display:grid;place-items:center;font-size:20px}.brand small{font-size:10px;letter-spacing:2px;color:var(--green);display:block;line-height:1;font-weight:700}.topnav{display:flex;gap:30px;align-items:center;font-size:13px;color:var(--muted)}.topnav strong{color:var(--green)}.avatar{width:31px;height:31px;border-radius:50%;background:#e4e8dc;display:grid;place-items:center;color:var(--green);font-weight:800}.wrap{max-width:1320px;margin:auto;padding:42px 30px 80px}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px}.intro h1{font-size:38px;line-height:1.22;letter-spacing:-1.8px;margin:9px 0}.intro p{color:var(--muted);margin:0}.pill{background:#eaf1db;color:#43654e;border-radius:30px;padding:9px 14px;font-size:12px;font-weight:700;white-space:nowrap}.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;margin-top:34px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px #1b37230a}.sidebar{padding:22px;height:max-content}.sidebar h2,.detail h2{font-size:18px;letter-spacing:-.5px;margin:0 0 18px}.search{width:100%;border:1px solid var(--line);border-radius:10px;background:#fafbf8;padding:11px 13px;outline-color:var(--green)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 19px}.filter{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;padding:6px 11px;font-size:12px}.filter.active{background:var(--green);color:#fff;border-color:var(--green)}.list-label{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1.4px;margin:0 0 8px}.question{width:100%;text-align:left;border:1px solid transparent;background:#fff;border-radius:12px;padding:14px 13px;margin:4px 0;display:block;color:var(--ink)}.question:hover{background:#f7f9f3}.question.active{background:#eef4e8;border-color:#d9e8d2}.question b{display:block;font-size:13px;line-height:1.5;margin:4px 0}.question span{font-size:11px;color:var(--muted)}.qnum{font-size:11px;color:var(--green)!important;font-weight:800;letter-spacing:1px}.empty{font-size:13px;color:var(--muted);padding:20px 5px}.detail{padding:30px 34px}.detail-top{display:flex;justify-content:space-between;gap:20px;align-items:start}.tag{display:inline-block;color:var(--green);background:#eaf2df;border-radius:5px;padding:5px 8px;font-size:11px;font-weight:800}.detail h2{font-size:27px;line-height:1.35;margin:16px 0 10px}.lead{color:var(--muted);font-size:14px;max-width:700px;margin:0}.bookmark{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;color:var(--muted)}.bookmark.on{color:var(--green);background:#eff5e7}.section{border-top:1px solid var(--line);margin-top:29px;padding-top:26px}.section-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin:0 0 17px}.section-title em{font-style:normal;background:#e9f0df;color:var(--green);width:25px;height:25px;border-radius:7px;display:grid;place-items:center;font-size:12px}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{border:1px solid var(--line);background:#fbfcf8;border-radius:12px;padding:16px}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{font-size:16px;display:block;margin-top:4px}.metric .sub{font-size:11px;color:var(--muted);display:block;margin-top:3px}.viz{display:grid;grid-template-columns:1fr 240px;gap:20px}.chart{background:#fbfcf8;border:1px solid var(--line);border-radius:13px;padding:18px 20px}.chart-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800}.chart-head small{color:var(--muted);font-weight:500}.barline{display:grid;grid-template-columns:110px 1fr 50px;gap:10px;align-items:center;margin-top:25px;font-size:12px}.track{height:28px;border-radius:5px;background:#edf1e9;overflow:hidden}.fill{height:100%;border-radius:5px;background:#a8c795}.fill.strong{background:var(--green)}.note{background:#f1f5ea;border-radius:12px;padding:17px;font-size:12px;color:#476054}.note b{display:block;color:var(--green);font-size:13px;margin-bottom:8px}.note p{margin:0}.ontology{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.node{border:1px solid #cbdcc9;background:#f7faf2;border-radius:8px;color:#3b6655;font-size:12px;font-weight:700;padding:9px 11px}.arrow{color:#87a692;font-weight:800}.methods{display:flex;flex-wrap:wrap;gap:8px}.method{font-size:12px;border-radius:6px;background:#f2f4ed;color:#526257;padding:7px 10px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:28px}.disclaimer{font-size:11px;color:var(--muted)}.primary{border:0;background:var(--green);color:white;padding:12px 17px;border-radius:9px;font-weight:800;font-size:13px}.primary:hover{background:#084833}.toast{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:11px 18px;border-radius:9px;box-shadow:0 8px 30px #0003;font-size:12px;display:none}.toast.show{display:block}@media(max-width:900px){.grid{grid-template-columns:1fr}.sidebar{height:auto}.viz{grid-template-columns:1fr}.intro h1{font-size:31px}}@media(max-width:650px){header{padding:0 18px}.topnav{display:none}.wrap{padding:30px 16px}.intro{display:block}.pill{display:inline-block;margin-top:15px}.detail{padding:22px}.metric-row{grid-template-columns:1fr}.barline{grid-template-columns:88px 1fr 44px}.bottom{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark">◈</span><span>PeopleLens<small>HR ANALYTICS LAB</small></span></div><nav class="topnav"><strong>질문 탐색</strong><span>지표 사전</span><span>데이터 구조</span><span>프로젝트 소개</span></nav><span class="avatar">PL</span></header>
<main class="wrap"><div class="intro"><div><div class="eyebrow">Explore → Define → Analyze</div><h1>좋은 HR 분석은<br>좋은 질문에서 시작됩니다.</h1><p>질문을 선택하고 필요한 데이터, 지표, 분석 방법의 연결을 확인해 보세요.</p></div><span class="pill">● 인터랙티브 프로토타입</span></div>
<div class="grid"><aside class="panel sidebar"><h2>질문 라이브러리</h2><input id="search" class="search" type="search" placeholder="질문 또는 키워드 검색" aria-label="질문 검색"><div class="filters" id="filters"></div><div class="list-label" id="count"></div><div id="questions"></div></aside><article class="panel detail" id="detail"></article></div></main><div id="toast" class="toast" role="status"></div>
<script>
const data=[
{id:'attrition',group:'퇴사',title:'초과근무 여부에 따라 6개월 퇴사율이 다른가?',desc:'초과근무 집단과 비초과근무 집단의 퇴사율 차이를 확인하고, 근속기간·부서 등을 함께 고려합니다.',outcome:'6개월 내 퇴사 여부',population:'기준일 재직자',unit:'직원 × 기준일',metric:'6개월 퇴사율',formula:'6개월 내 퇴사자 / 기준일 재직자',bars:[['초과근무 없음',12],['초과근무 있음',28]],fields:['employee_id','snapshot_date','overtime','termination_date','department','tenure_months'],methods:['집단별 비율 비교','로지스틱 회귀','부서별 층화 분석'],warning:'예시 수치는 가상 데이터입니다. 집단 간 차이를 초과근무의 인과효과로 단정할 수 없습니다.',relation:['초과근무','6개월 퇴사율','퇴사 이벤트']},
{id:'tenure',group:'퇴사',title:'입사 초기 직원의 퇴사 위험이 더 높은가?',desc:'근속기간별 퇴사 발생을 비교해 초기 적응 구간에서의 패턴을 살펴봅니다.',outcome:'6개월 내 퇴사 여부',population:'기준일 재직자',unit:'직원 × 기준일',metric:'근속 구간별 퇴사율',formula:'구간별 6개월 내 퇴사자 / 구간별 기준일 재직자',bars:[['12개월 이상',14],['12개월 미만',25]],fields:['employee_id','hire_date','snapshot_date','termination_date'],methods:['코호트별 비율 비교','생존분석'],warning:'근속기간과 채용 시기의 영향을 구분하고, 관측 기간이 충분한지 확인해야 합니다.',relation:['근속기간','구간별 퇴사율','퇴사 이벤트']},
{id:'performance',group:'성과',title:'교육 참여 전후 성과 지표는 어떻게 변했는가?',desc:'교육 이수 시점과 평가 주기를 맞춰 전후 성과 변화를 살펴봅니다.',outcome:'성과 평점',population:'평가 가능 직원',unit:'직원 × 평가 기간',metric:'평균 성과 평점',formula:'평점 합계 / 평가 대상자 수',bars:[['교육 전',62],['교육 후',71]],fields:['employee_id','training_date','review_date','performance_rating'],methods:['전후 평균 비교','비교집단 설계'],warning:'전후 변화만으로 교육 효과를 확정할 수 없습니다. 평가 기준 변경과 선택 편향을 확인해야 합니다.',relation:['교육 참여','평균 성과 평점','평가 이벤트']},
{id:'hiring',group:'채용',title:'채용 경로별 1년 근속률에는 차이가 있는가?',desc:'채용 경로별 입사 코호트를 정의하고 동일한 추적 기간에서 유지율을 비교합니다.',outcome:'입사 후 1년 재직 여부',population:'1년 추적이 가능한 입사자',unit:'입사자 × 코호트',metric:'1년 근속률',formula:'입사 1년 뒤 재직자 / 해당 코호트 입사자',bars:[['공고 지원',67],['추천 채용',78]],fields:['employee_id','hire_date','hire_source','termination_date'],methods:['코호트 분석','비율 비교','통제변수 검토'],warning:'최근 입사자처럼 아직 1년이 지나지 않은 인원을 분모에 넣지 않아야 합니다.',relation:['채용 경로','1년 근속률','재직 상태']},
{id:'mobility',group:'조직',title:'부서 이동 경험과 이후 퇴사율은 관련이 있는가?',desc:'이동 시점 이전·이후 정보를 구분하여 직원 이동과 퇴사 패턴을 살펴봅니다.',outcome:'이동 후 6개월 내 퇴사',population:'분석 기준일 재직자',unit:'직원 × 기준일',metric:'이동 경험별 퇴사율',formula:'집단별 6개월 내 퇴사자 / 집단별 기준일 재직자',bars:[['이동 경험 없음',18],['이동 경험 있음',11]],fields:['employee_id','snapshot_date','transfer_date','termination_date'],methods:['집단별 비율 비교','시점 정렬','로지스틱 회귀'],warning:'이동 결정의 이유와 시점이 결과에 영향을 줄 수 있습니다.',relation:['부서 이동','6개월 퇴사율','퇴사 이벤트']}
];
let selected='attrition',group='전체',query='',saved=new Set();const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}function renderFilters(){let groups=['전체','퇴사','성과','채용','조직'];$('filters').innerHTML=groups.map(g=>`<button class="filter ${g===group?'active':''}" data-group="${g}">${g}</button>`).join('');$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{group=b.dataset.group;render()})}function renderList(){let matches=data.filter(d=>(group==='전체'||d.group===group)&&(d.title+d.desc+d.group).includes(query));$('count').textContent=`QUESTIONS  /  ${String(matches.length).padStart(2,'0')}`;$('questions').innerHTML=matches.length?matches.map((d,i)=>`<button class="question ${d.id===selected?'active':''}" data-id="${d.id}"><span class="qnum">Q${String(data.indexOf(d)+1).padStart(2,'0')} · ${d.group}</span><b>${d.title}</b><span>${d.methods[0]} · ${d.metric}</span></button>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>';$('questions').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;renderList();renderDetail()})}function renderDetail(){let d=data.find(x=>x.id===selected),max=Math.max(...d.bars.map(x=>x[1]));$('detail').innerHTML=`<div class="detail-top"><div><span class="tag">${d.group} ANALYTICS</span><h2>${d.title}</h2><p class="lead">${d.desc}</p></div><button class="bookmark ${saved.has(d.id)?'on':''}" id="bookmark" aria-label="질문 저장">${saved.has(d.id)?'★':'☆'}</button></div><div class="section"><h3 class="section-title"><em>01</em> 분석 질문 정의</h3><div class="metric-row"><div class="metric"><small>결과 변수</small><b>${d.outcome}</b><span class="sub">무엇을 설명할 것인가</span></div><div class="metric"><small>분석 대상</small><b>${d.population}</b><span class="sub">분모를 명확히 정의</span></div><div class="metric"><small>데이터 단위</small><b>${d.unit}</b><span class="sub">한 행의 의미</span></div></div></div><div class="section"><h3 class="section-title"><em>02</em> 지표와 시각화</h3><div class="viz"><div class="chart"><div class="chart-head"><span>${d.metric} 비교</span><small>예시 데이터 · %</small></div>${d.bars.map(([name,n],i)=>`<div class="barline"><span>${name}</span><div class="track"><div class="fill ${i?'strong':''}" style="width:${n/max*86}%"></div></div><b>${n}%</b></div>`).join('')}</div><div class="note"><b>지표 계산식</b><p>${d.formula}</p><br><b>해석 시 유의</b><p>${d.warning}</p></div></div></div><div class="section"><h3 class="section-title"><em>03</em> 데이터와 개념 연결</h3><div class="ontology"><span class="node">질문</span><span class="arrow">→</span><span class="node">${d.relation[0]}</span><span class="arrow">→</span><span class="node">${d.relation[1]}</span><span class="arrow">→</span><span class="node">${d.relation[2]}</span></div><p class="disclaimer" style="margin:15px 0 0">필요 필드: ${d.fields.map(f=>`<code>${f}</code>`).join(' · ')}</p></div><div class="section"><h3 class="section-title"><em>04</em> 추천 분석 방법</h3><div class="methods">${d.methods.map(m=>`<span class="method">${m}</span>`).join('')}</div></div><div class="bottom"><span class="disclaimer">이 화면은 설계 시안이며 분석 결과는 가상 예시입니다.</span><button class="primary" id="simulate">분석 흐름 미리보기 ↗</button></div>`;$('bookmark').onclick=()=>{saved.has(d.id)?saved.delete(d.id):saved.add(d.id);renderDetail();toast(saved.has(d.id)?'질문을 이 브라우저에서 저장했습니다.':'저장을 해제했습니다.')};$('simulate').onclick=()=>toast('데이터 업로드와 실제 분석은 Firebase 연결 후 구현할 기능입니다.')};function render(){renderFilters();renderList();renderDetail()}$('search').addEventListener('input',e=>{query=e.target.value.trim();renderList()});render();
</script>
</body></html>
